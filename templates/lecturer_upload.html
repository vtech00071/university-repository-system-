{% extends 'base.html' %}

{% block content %}
<section class="form-section">
    <div class="container form-container">
        <div class="form-header">
            <span class="badge badge-lecturer">Academic Research Publication</span>
            <h1 class="page-title">Submit Lecturer Research Material</h1>
            <p class="page-description">Publish research documents, journal pre-prints, and departmental papers to the
                central repository.</p>
        </div>

        <form action="/lecturer/upload" method="POST" enctype="multipart/form-data" class="repository-form"
            id="lecturerForm">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="title" class="form-label">Research / Project Title <span
                            class="required">*</span></label>
                    <input type="text" id="title" name="title" class="form-input"
                        placeholder="e.g., Empirical Evaluation of Data Indexing in SQLite" required>
                </div>

                <div class="form-group">
                    <label for="author_name" class="form-label">Lecturer Name(s) & Title(s) <span
                            class="required">*</span></label>
                    <input type="text" id="author_name" name="author_name" class="form-input"
                        placeholder="Separate multiple names with commas" required>
                </div>

                <div class="form-group">
                    <label for="department" class="form-label">Department <span class="required">*</span></label>
                    <input type="text" id="department" name="department" class="form-input"
                        placeholder="e.g., Computer Science" required>
                </div>

                <div class="form-group">
                    <label for="academic_session" class="form-label">Academic Session <span
                            class="required">*</span></label>
                    <input type="text" id="academic_session" name="academic_session" class="form-input"
                        placeholder="e.g., 2025/2026" required>
                </div>

                <div class="form-group">
                    <label for="keywords" class="form-label">Keywords <span class="required">*</span></label>
                    <input type="text" id="keywords" name="keywords" class="form-input"
                        placeholder="Comma-separated (e.g., Machine Learning, Optimization)" required>
                </div>

                <div class="form-group full-width">
                    <label for="abstract" class="form-label">Abstract / Summary <span class="required">*</span></label>
                    <textarea id="abstract" name="abstract" rows="6" class="form-textarea"
                        placeholder="Paste the research abstract..." required></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="pdf_file" class="form-label">Research Document (PDF Only) <span
                            class="required">*</span></label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="pdf_file" name="pdf_file" accept=".pdf" class="file-input" required>
                        <span class="file-hint">Maximum upload size: 16 MB. Only valid .pdf files are accepted.</span>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-submit">Submit Publication</button>
                <a href="/" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
