{% extends 'base.html' %}

{% block content %}
<section class="form-section">
    <div class="container form-container" style="max-width: 400px;">
        <div class="form-header" style="text-align: center;">
            <h1 class="page-title">System Login</h1>
            <p class="page-description">Sign in to upload materials or manage the repository.</p>
        </div>

        <form action="/login" method="POST" class="repository-form">
            <div class="form-group" style="margin-bottom: 16px;">
                <label for="username" class="form-label">Username / Matric Number</label>
                <input type="text" id="username" name="username" class="form-input" required>
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>

            <div style="text-align: center; margin-top: 20px;">
                <span style="color: var(--text-muted); font-size: 0.9rem;">Don't have an account? <a href="/register"
                        style="color: var(--accent-color);">Register here</a></span>
            </div>
        </form>
    </div>
</section>
{% endblock %}
