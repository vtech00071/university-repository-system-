{% extends 'base.html' %}

{% block content %}
<section class="form-section">
    <div class="container form-container" style="max-width: 400px;">
        <div class="form-header" style="text-align: center;">
            <h1 class="page-title">Create Account</h1>
            <p class="page-description">Register as a new student or lecturer to access the repository.</p>
        </div>

        <form action="/register" method="POST" class="repository-form">
            <div class="form-group" style="margin-bottom: 16px;">
                <label for="username" class="form-label">Username / Matric Number <span class="required">*</span></label>
                <input type="text" id="username" name="username" class="form-input" required>
            </div>

            <div class="form-group" style="margin-bottom: 16px;">
                <label for="password" class="form-label">Password <span class="required">*</span></label>
                <input type="password" id="password" name="password" class="form-input" required>
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label for="role" class="form-label">Account Type <span class="required">*</span></label>
              <select id="role" name="role" class="form-input" required>
                    <option value="STUDENT">Student</option>
                    <option value="LECTURER">Lecturer</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
            
            <div style="text-align: center; margin-top: 20px;">
                <span style="color: var(--text-muted); font-size: 0.9rem;">Already have an account? <a href="/login" style="color: var(--accent-color);">Login here</a></span>
            </div>
        </form>
    </div>
</section>
{% endblock %}
