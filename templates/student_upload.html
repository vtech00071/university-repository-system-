{% extends 'base.html' %}

{% block content %}
<section class="form-section">
    <div class="container form-container">
        <div class="form-header">
            <span class="badge badge-student">Undergraduate Project Submission</span>
            <h1 class="page-title">Submit Student Final-Year Project</h1>
            <p class="page-description">Fill out the required metadata and upload the project document in PDF format.
            </p>
        </div>

        <form action="/student/upload" method="POST" enctype="multipart/form-data" class="repository-form"
            id="studentForm">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="title" class="form-label">Project Title <span class="required">*</span></label>
                    <input type="text" id="title" name="title" class="form-input"
                        placeholder="e.g., Design and Implementation of an Academic Repository" required>
                </div>

                <div class="form-group">
                    <label for="author_name" class="form-label">Student Name(s) <span class="required">*</span></label>
                    <input type="text" id="author_name" name="author_name" class="form-input"
                        placeholder="Separate multiple names with commas" required>
                </div>

                <div class="form-group">
                    <label for="matric_number" class="form-label">Matriculation Number(s) <span
                            class="required">*</span></label>
                    <input type="text" id="matric_number" name="matric_number" class="form-input"
                        placeholder="Separate multiple numbers with commas" required>
                </div>

                <div class="form-group">
                    <label for="department" class="form-label">Department <span class="required">*</span></label>
                    <input type="text" id="department" name="department" class="form-input"
                        placeholder="e.g., Computer Science" required>
                </div>

                <div class="form-group">
                    <label for="supervisor" class="form-label">Project Supervisor <span
                            class="required">*</span></label>
                    <input type="text" id="supervisor" name="supervisor" class="form-input"
                        placeholder="e.g., Dr. A. B. Adeyemi" required>
                </div>

                <div class="form-group">
                    <label for="academic_session" class="form-label">Academic Session <span
                            class="required">*</span></label>
                    <input type="text" id="academic_session" name="academic_session" class="form-input"
                        placeholder="e.g., 2025/2026" required>
                </div>

                <div class="form-group">
                    <label for="keywords" class="form-label">Keywords <span class="required">*</span></label>
                    <input type="text" id="keywords" name="keywords" class="form-input"
                        placeholder="Comma-separated (e.g., Flask, Repository, SQLite)" required>
                </div>

                <div class="form-group full-width">
                    <label for="abstract" class="form-label">Project Abstract <span class="required">*</span></label>
                    <textarea id="abstract" name="abstract" rows="6" class="form-textarea"
                        placeholder="Paste the complete project abstract..." required></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="pdf_file" class="form-label">Project Document (PDF Only) <span
                            class="required">*</span></label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="pdf_file" name="pdf_file" accept=".pdf" class="file-input" required>
                        <span class="file-hint">Maximum upload size: 16 MB. Only valid .pdf files are accepted.</span>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-submit">Submit Project</button>
                <a href="/" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
